# EDITH (Every Device In The House)
# TrueNAS / HexOS: paste into https://<nas>/ui/ > Apps > Discover Apps > ⋮ > Install via YAML
# Anywhere else: docker compose up -d
# Then open http://<host>:7575 and add your servers.
services:
  edith:
    image: ghcr.io/thegreatmate/edith:latest
    container_name: edith
    restart: unless-stopped
    pull_policy: always
    ports:
      - "7575:7575"
    volumes:
      # Servers, API keys, tracked apps and favorites are saved here. Change to a path on your server.
      - /mnt/POOL/apps/edith:/app/data
    environment:
      CHECK_INTERVAL: "30"
      # Optional: Plex "now playing"
      PLEX_URL: ""
      PLEX_TOKEN: ""
