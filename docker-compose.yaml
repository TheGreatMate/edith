# EDITH (Every Device In The House)
# TrueNAS / HexOS: paste into https://<nas>/ui/ > Apps > Discover Apps > ⋮ > Install via YAML
# Anywhere else: docker compose up -d
services:
  edith:
    image: ghcr.io/thegreatmate/edith:latest
    container_name: edith
    restart: unless-stopped
    pull_policy: always
    ports:
      - "7575:7575"
    volumes:
      # Tracked apps, favorites and ignored ports live here. Change to a path on your server.
      - /mnt/POOL/apps/edith:/app/data
    environment:
      # Leave a server's HOST empty to hide it.
      UNRAID_NAME: Tower
      UNRAID_HOST: 192.168.1.10
      UNRAID_URL: ""            # only if the web UI isn't at http://UNRAID_HOST
      UNRAID_API_KEY: ""
      TRUENAS_NAME: NAS
      TRUENAS_HOST: 192.168.1.20
      TRUENAS_API_KEY: ""
      PLEX_URL: ""              # e.g. http://192.168.1.10:32400
      PLEX_TOKEN: ""
      CHECK_INTERVAL: "30"
